# Makespace storage manager: MongoDB + API server + web server, with
# Keycloak (and its own PostgreSQL) for logins.
#
#   cp .env.example .env      # then edit the passwords and secrets
#   docker compose up -d --build
#
# Browse to http://<pi-address>:5000 .  Anyone can look things up;
# changing anything needs a Keycloak login.  The API is published only
# on the Pi's loopback (127.0.0.1:8000); it too lets anyone read, but
# needs a Keycloak access token for anything else.
#
# Keycloak is published on port 8080 because browsers are sent there to
# log in.  Its admin console is at ${KEYCLOAK_URL}/admin/ .

services:
  mongo:
    image: ${MONGO_IMAGE:-mongo:7}
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME:-root}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?set MONGO_ROOT_PASSWORD in .env}
      MONGO_INITDB_DATABASE: ${DATABASE_NAME:-makespace-storage}
      # Read by docker/mongo-init/create-app-user.sh
      MONGOUSER: ${MONGOUSER:-makespace}
      MONGOPASSWORD: ${MONGOPASSWORD:?set MONGOPASSWORD in .env}
    volumes:
      # Database files live in a host directory (on the Pi, the SSD).
      - ${MONGO_DATA_DIR:-/mnt/nvm0/data}:/data/db
      - ./docker/mongo-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # 4.4 images have `mongo`, 5.0+ images have `mongosh`.
      test: ["CMD-SHELL", "mongosh --quiet --eval 'db.adminCommand(\"ping\").ok' 2>/dev/null || mongo --quiet --eval 'db.adminCommand(\"ping\").ok'"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    restart: unless-stopped
    environment:
      MONGOURI: mongodb://mongo:27017/
      DATABASE_NAME: ${DATABASE_NAME:-makespace-storage}
      MONGOUSER: ${MONGOUSER:-makespace}
      MONGOPASSWORD: ${MONGOPASSWORD:?set MONGOPASSWORD in .env}
      # Tokens must have been issued by this (public) address...
      KEYCLOAK_URL: ${KEYCLOAK_URL:?set KEYCLOAK_URL in .env}
      # ...but the signing keys are fetched over the compose network.
      KEYCLOAK_INTERNAL_URL: http://keycloak:8080
      KEYCLOAK_REALM: ${KEYCLOAK_REALM:-makespace}
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    depends_on:
      mongo:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    restart: unless-stopped
    environment:
      STORAGE_API_URL: http://api:8000
      STORAGE_WEB_URL: ${STORAGE_WEB_URL:-http://localhost:5000}
      KEYCLOAK_URL: ${KEYCLOAK_URL:?set KEYCLOAK_URL in .env}
      KEYCLOAK_INTERNAL_URL: http://keycloak:8080
      KEYCLOAK_REALM: ${KEYCLOAK_REALM:-makespace}
      STORAGE_WEB_CLIENT_SECRET: ${STORAGE_WEB_CLIENT_SECRET:?set STORAGE_WEB_CLIENT_SECRET in .env}
      FLASK_SECRET_KEY: ${FLASK_SECRET_KEY:?set FLASK_SECRET_KEY in .env}
    ports:
      - "${WEB_PORT:-5000}:5000"
    depends_on:
      - api

  keycloak-db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?set KEYCLOAK_DB_PASSWORD in .env}
    volumes:
      - ${KEYCLOAK_DB_DIR:-/mnt/nvm0/keycloak-db}:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak -d keycloak"]
      interval: 10s
      timeout: 5s
      retries: 6

  keycloak:
    image: quay.io/keycloak/keycloak:${KEYCLOAK_VERSION:-26.4}
    restart: unless-stopped
    # --import-realm creates the realm from docker/keycloak/*.json the
    # first time only; after that, change it in the admin console.
    command: ["start", "--import-realm"]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?set KEYCLOAK_DB_PASSWORD in .env}
      # The address browsers use; it is also the token issuer.
      KC_HOSTNAME: ${KEYCLOAK_URL:?set KEYCLOAK_URL in .env}
      # Let the api and web containers use http://keycloak:8080 .
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      # Plain HTTP is allowed only from private networks (the realm has
      # sslRequired=external).  Behind an HTTPS reverse proxy, set
      # KEYCLOAK_URL to the https:// address and uncomment this:
      # KC_PROXY_HEADERS: xforwarded
      KC_HTTP_ENABLED: "true"
      KC_HEALTH_ENABLED: "true"
      # Account for the Keycloak admin console; used only when the
      # database is empty.  Change the password in the console after.
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?set KEYCLOAK_ADMIN_PASSWORD in .env}
      # Substituted into the realm file at import time.
      KEYCLOAK_REALM: ${KEYCLOAK_REALM:-makespace}
      STORAGE_WEB_URL: ${STORAGE_WEB_URL:-http://localhost:5000}
      STORAGE_WEB_CLIENT_SECRET: ${STORAGE_WEB_CLIENT_SECRET:?set STORAGE_WEB_CLIENT_SECRET in .env}
      STORAGE_SERVICE_CLIENT_SECRET: ${STORAGE_SERVICE_CLIENT_SECRET:?set STORAGE_SERVICE_CLIENT_SECRET in .env}
      STORAGE_MAINTENANCE_CLIENT_SECRET: ${STORAGE_MAINTENANCE_CLIENT_SECRET:?set STORAGE_MAINTENANCE_CLIENT_SECRET in .env}
    volumes:
      - ./docker/keycloak:/opt/keycloak/data/import:ro
    ports:
      - "${KEYCLOAK_PORT:-8080}:8080"
    healthcheck:
      # The image has no curl, so talk HTTP to the management port by hand.
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 && grep -q '\"UP\"' <&3"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 90s
    depends_on:
      keycloak-db:
        condition: service_healthy